name: Stress Tests

permissions:
  contents: read

on:
  schedule:
    # Every Monday at 02:00 UTC
    - cron: '0 2 * * 1'
  workflow_dispatch:
  pull_request:
    branches: [main, develop]
    types: [labeled]

jobs:
  stress-test:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(github.event.label.name, 'performance')
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.44.4

      - name: Install dependencies
        run: flutter pub get

      - name: Generate l10n
        run: flutter gen-l10n

      - name: Generate Drift code
        run: dart run build_runner build

      - name: Run stress tests
        run: flutter test --tags stress --timeout 600s

  report-scheduled-failure:
    if: always() && github.event_name == 'schedule' && needs.stress-test.result == 'failure'
    needs: stress-test
    permissions:
      issues: write
    runs-on: ubuntu-latest
    steps:
      - name: Create issue on failure
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Stress tests failed (weekly run)',
              body: 'The weekly stress test run failed. See [workflow run](' + context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId + ') for details.',
              labels: ['stress-test', 'bug', 'auto-generated']
            })
