name: CI

permissions:
  contents: read

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # Security scans run first and fail closed. If gitleaks flags a known
      # test fixture, allowlist that exact path/commit in .gitleaksignore —
      # never disable the scanner.
      - name: Secret scanning (gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Dependency CVE scan (osv-scanner)
        uses: google/osv-scanner-action/osv-scanner-action@6e4298ebc4db23e847df9b2e2de2939d6f066c67
        with:
          scan-args: |-
            --recursive
            ./

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: 3.44.4
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate l10n
        run: flutter gen-l10n

      - name: Generate Drift code
        run: dart run build_runner build

      - name: Check domain import fence
        run: dart run tool/check_domain_fence.dart

      - name: Analyze
        id: analyze
        run: flutter analyze 2>&1 | tee analyze_output.txt; exit ${PIPESTATUS[0]}
        continue-on-error: true

      - name: Upload analyze output on failure
        if: steps.analyze.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: analyze-output
          path: analyze_output.txt

      - name: Fail if analyze failed
        if: steps.analyze.outcome == 'failure'
        run: exit 1

      - name: Run tests with coverage
        run: flutter test --coverage --exclude-tags stress

      - name: Run performance benchmarks
        run: flutter test test/performance/ --no-pub --reporter compact

      # Device tests require an emulator. Release candidates run the blocking
      # Android smoke lane in release-trust.yml; keep this host job deterministic.
      - name: Check integration_test formatting and analysis
        run: |
          dart format --set-exit-if-changed integration_test/
          flutter analyze integration_test/

      # Coverage gate: global ≥60% + sale-logic ≥92% in one call.
      # Migrated from archived VeryGoodOpenSource/very_good_coverage@v3 to
      # tool/check_path_coverage.dart (sole gate — handles both thresholds).
      # sale-logic ratcheted to 92 (actual 92.38 at the 2026-08 clamp); raise
      # only after measured headroom, never lower without an explicit ADR.
      # Exclude globs must stay in sync with kCoverageExclude* in the script.
      - name: Coverage gate (global ≥60%, sale-logic ≥92%)
        run: >
          dart run tool/check_path_coverage.dart
          --lcov coverage/lcov.info
          --fail
          --min-global=60
          --min-sale-logic=92

      - name: Upload coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: coverage-report
          path: coverage/lcov.info

      - name: Upload to Codecov
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238
        with:
          files: coverage/lcov.info
          fail_ci_if_error: false

      - name: Check Dart formatting
        run: dart format --set-exit-if-changed lib/ test/

      - name: Dependency audit
        run: |
          dart pub outdated --json > pub-outdated.json
          dart run tool/check_outdated.dart
          dart pub outdated --no-dev-dependencies

      - name: Verify debug build
        run: flutter build apk --debug --flavor dev -t lib/main_dev.dart
