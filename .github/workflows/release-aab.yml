# E4 / POST-090 A3 — Release packaging gate.
# 1) Always runs money-path trust suite (fail-closed via release-trust.yml).
# 2) Builds a signed prod AAB; missing ANDROID_KEYSTORE_* secrets fail closed.
#
# Secrets (all required for signed AAB):
#   ANDROID_KEYSTORE_BASE64  — base64 of the .jks / .keystore file
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
#
# Tags `v*` and manual production cuts: signed AAB is required (fail-closed).
# Store upload stays manual.
name: Release AAB

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-aab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  money-path:
    name: Money path (fail-closed)
    uses: ./.github/workflows/release-trust.yml

  signed-aab:
    name: Signed prod AAB
    needs: money-path
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate release tag and app version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          app_version="$(sed -n "s/^version: *\([^+ ]*\).*/\1/p" pubspec.yaml)"
          test -n "$app_version"
          if [ "$tag_version" != "$app_version" ]; then
            echo "::error title=Version mismatch::Tag v$tag_version does not match pubspec version $app_version"
            exit 1
          fi
          case "$tag_version" in
            ''|*[!0-9.]*|.*|*..*|*.)
              echo "::error title=Invalid semver::Tag must use vMAJOR.MINOR.PATCH"
              exit 1
              ;;
          esac

      - name: Detect signing secrets
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ] && \
             [ -n "${ANDROID_KEYSTORE_PASSWORD:-}" ] && \
             [ -n "${ANDROID_KEY_ALIAS:-}" ] && \
             [ -n "${ANDROID_KEY_PASSWORD:-}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Signing secrets present — will build signed prod AAB."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::error title=A3 signed AAB required::Production release requires all ANDROID_KEYSTORE_* secrets."
            exit 1
          fi

      - name: Set up Flutter
        if: steps.signing.outputs.available == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.4

      - name: Set up Java 17
        if: steps.signing.outputs.available == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        if: steps.signing.outputs.available == 'true'
        run: flutter pub get

      - name: Generate l10n
        if: steps.signing.outputs.available == 'true'
        run: flutter gen-l10n

      - name: Generate Drift / injectable code
        if: steps.signing.outputs.available == 'true'
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Materialize keystore (never commit)
        if: steps.signing.outputs.available == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > android/app/keystore.properties
          # Fail closed if properties missing (Gradle also enforces this).
          test -f android/app/keystore.properties
          test -f android/app/upload-keystore.jks

      - name: Build signed prod App Bundle
        if: steps.signing.outputs.available == 'true'
        run: flutter build appbundle --release --flavor prod -t lib/main_prod.dart

      - name: Upload prodRelease AAB
        if: steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: app-prod-release-aab
          path: build/app/outputs/bundle/prodRelease/app-prod-release.aab
          if-no-files-found: error
          retention-days: 14