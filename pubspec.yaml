name: promsell_pos_ce
description: "PromSell POS Community Edition — Offline-first mobile POS for small businesses"
publish_to: 'none'
version: 0.9.1+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.10

  # State Management
  flutter_bloc: ^9.1.1
  bloc_concurrency: ^0.3.0
  equatable: ^2.1.0

  # Database (Drift)
  drift: ^2.26.1
  path: ^1.9.0
  path_provider: ^2.1.6
  # SQLCipher — full-database AES-256-CBC encryption (Phase 2a / v0.9.0)
  # Note: This package REPLACES sqlite3_flutter_libs (both provide the same classes)
  sqlcipher_flutter_libs: ^0.6.0
  # sqlite3 — required directly for open.overrideFor() to load libsqlcipher.so
  sqlite3: ^2.9.4
  # Secure storage for the DB encryption key (Keystore on Android, Keychain on iOS)
  flutter_secure_storage: ^10.3.1

  # Dependency Injection
  get_it: ^9.0.0
  injectable: ^3.0.0

  # PDF Receipt
  pdf: ^3.13.0
  printing: ^5.15.0

  # Utilities
  intl: ^0.20.2
  meta: ^1.16.0
  uuid: ^4.6.0
  image_picker: ^1.2.3
  image: ^4.9.1
  cached_network_image: ^3.3.0
  image_cropper: ^12.0.0

  # UI Animation
  animated_flip_counter: ^0.3.4
  shimmer: ^3.0.0
  fl_chart: ^0.70.2

  # Merchant Tools
  share_plus: ^13.0.0
  package_info_plus: ^10.2.1
  # file_picker 12.x is pre-release but required for win32 ^6 compat with package_info_plus
  file_picker: 12.0.0-beta.7
  csv: ^8.0.0
  qr_flutter: ^4.1.0
  barcode_widget: ^2.0.4
  barcode: ^2.2.9
  thai_promptpay: ^0.3.0
  mobile_scanner: ^7.4.0
  audioplayers: ^6.8.1
  permission_handler: ^12.0.0

  # Backup Encryption
  encrypt: ^5.0.3
  crypto: ^3.0.6
  tabler_icons_plus: ^3.44.0
  table_calendar: ^3.2.0

dependency_overrides:
  # Pin image_picker_android to specific version due to compatibility constraint
  # TODO: Document reason and revisit when upgrading image_picker
  image_picker_android: 0.8.13+19

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Testing
  mocktail: ^1.0.4
  bloc_test: ^10.0.0
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter

  # Drift codegen
  drift_dev: ^2.26.1
  build_runner: ^2.15.1

  # DI codegen
  injectable_generator: ^3.0.0

  # App Icon Generator
  flutter_launcher_icons: ^0.14.3


flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.jpeg"
  min_sdk_android: 21
  adaptive_icon_background: "#1B6B2A"
  adaptive_icon_foreground: "assets/icons/app_icon.jpeg"
  web:
    generate: false
  windows:
    generate: false

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/images/onboarding/
    - assets/images/demo/
    - assets/images/home/
    - LICENSE
    - assets/icons/
    - assets/fonts/

  fonts:
    - family: NotoSansThai
      fonts:
        - asset: assets/fonts/NotoSansThai-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansThai-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansThai-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSansThai-Bold.ttf
          weight: 700
